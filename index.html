const lightboxOverlay = document.getElementById('lightboxOverlay');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

/* ---------- Lightbox ---------- */
function showLightbox(src, alt) {
  lightboxImg.src = src;
  lightboxImg.alt = alt || '图片预览';
  lightboxOverlay.classList.remove('opacity-0', 'pointer-events-none');
  lightboxOverlay.setAttribute('aria-hidden', 'false');
  lightboxClose.focus();
}
function hideLightbox() {
  lightboxOverlay.classList.add('opacity-0', 'pointer-events-none');
  lightboxOverlay.setAttribute('aria-hidden', 'true');
  lightboxImg.src = '';
}
lightboxClose.addEventListener('click', hideLightbox);
lightboxOverlay.addEventListener('click', e => { if (e.target === lightboxOverlay) hideLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lightboxOverlay.classList.contains('pointer-events-none')) hideLightbox(); });

/* ---------- Toast ---------- */
function showToast() {
  copyToast.classList.remove('opacity-0', 'translate-y-4');
  clearTimeout(copyToast._t);
  copyToast._t = setTimeout(() => copyToast.classList.add('opacity-0', 'translate-y-4'), 2000);
}

/* ---------- Clipboard ---------- */
function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(showToast);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  }
}
function setupEmail() {
  document.querySelectorAll('[data-email-user]').forEach(b => {
    b.addEventListener('click', () => copyToClipboard(b.getAttribute('data-email-user') + '@' + b.getAttribute('data-email-domain')));
  });
}

/* ---------- Tabs ---------- */
function initTabs() {
  document.querySelectorAll('.tab-nav').forEach(nav => {
    const gid = nav.dataset.tabgroup;
    const btns = nav.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll(`.tab-panel[data-tabgroup="${gid}"]`);
    btns.forEach(btn => {
      btn.addEventListener('click', () => activateTab(gid, btn.dataset.panel, btns, panels));
      btn.addEventListener('keydown', e => {
        const idx = Array.from(btns).indexOf(btn);
        let n = idx;
        if (e.key === 'ArrowRight') { n = (idx + 1) % btns.length; e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { n = (idx - 1 + btns.length) % btns.length; e.preventDefault(); }
        if (n !== idx) { btns[n].focus(); btns[n].click(); }
      });
    });
  });
}
function activateTab(gid, pid, btns, panels) {
  btns.forEach(b => {
    b.classList.remove('text-white', 'bg-white/10', 'border-cyan-400/40');
    b.classList.add('text-slate-400', 'bg-transparent', 'border-transparent');
    b.setAttribute('aria-selected', 'false');
  });
  panels.forEach(p => {
    p.classList.add('hidden');
    p.classList.remove('animate-fade-slide-in');
  });
  const tb = Array.from(btns).find(b => b.dataset.panel === pid);
  const tp = Array.from(panels).find(p => p.id === pid);
  if (tb) {
    tb.classList.remove('text-slate-400', 'bg-transparent', 'border-transparent');
    tb.classList.add('text-white', 'bg-white/10', 'border-cyan-400/40');
    tb.setAttribute('aria-selected', 'true');
  }
  if (tp) {
    tp.classList.remove('hidden');
    void tp.offsetWidth;
    tp.classList.add('animate-fade-slide-in');
  }
}

    <div class="tab-nav flex gap-1.5 p-1.5 mb-4 rounded-2xl bg-slate-900/40 border border-white/10 backdrop-blur-sm overflow-x-auto scrollbar-none" role="tablist" aria-label="获奖证书与教育背景" data-tabgroup="${gid}">
      <button class="tab-btn text-white bg-white/10 border-cyan-400/40 flex-shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all duration-300 whitespace-nowrap" role="tab" aria-selected="true" aria-controls="tab-cert" id="tab-cert-tab" data-panel="tab-cert" data-tabgroup="${gid}">📜 获奖与证书</button>
      <button class="tab-btn text-slate-400 bg-transparent border-transparent flex-shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all duration-300 whitespace-nowrap" role="tab" aria-selected="false" aria-controls="tab-edu" id="tab-edu-tab" data-panel="tab-edu" data-tabgroup="${gid}">🏫 教育背景</button>
    </div>`;
  head.querySelectorAll('div').forEach(d => {});
  s.appendChild(head.firstElementChild);   // sectionHeading
  s.appendChild(head.firstElementChild);   // tab-nav
  s.appendChild(certPanel);
  s.appendChild(eduWrap);
  return s;
}

/* ---------- Mount sections ---------- */
main.appendChild(buildHero());
main.appendChild(buildHighlights());
main.appendChild(buildExperience());
main.appendChild(buildProjects());
main.appendChild(buildSkills());
main.appendChild(buildEduCert());

initTabs();
setupEmail();
document.getElementById('douyinBtn').addEventListener('click', () => showLightbox(document.getElementById('douyinBtn').getAttribute('data-img'), '抖音主页截图'));

// Back to top
function updateBackTop() {
  if (scrollY > 500) {
    backToTop.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
  } else {
    backToTop.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
  }
}
backToTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
addEventListener('scroll', updateBackTop, { passive: true });

// Print
printBtn.addEventListener('click', () => {
  const ps = document.querySelectorAll('.tab-panel');
  const hidden = [];
  ps.forEach(p => {
    if (p.classList.contains('hidden')) { hidden.push(p); p.classList.remove('hidden'); }
  });
  print();
  setTimeout(() => {
    hidden.forEach(p => p.classList.add('hidden'));
    initTabs();
  }, 300);
});

// Smooth nav links
document.querySelectorAll('.nav-links a[href^="#"]').forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    const id = this.getAttribute('href').substring(1);
    const el = document.getElementById(id);
    if (el) {
      const navH = 64;
      scrollTo({ top: el.getBoundingClientRect().top + pageYOffset - navH - 8, behavior: 'smooth' });
    }
  });
});

// Render Lucide icons (after DOM is built)
if (window.lucide && window.lucide.createIcons) {
  window.lucide.createIcons();
} else {
  const tryRender = () => {
    if (window.lucide && window.lucide.createIcons) { window.lucide.createIcons(); }
    else { setTimeout(tryRender, 150); }
  };
  tryRender();
}

})();
</script>
</body>
</html>
