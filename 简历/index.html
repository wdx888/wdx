const main=document.getElementById('mainContent');const themeToggle=document.getElementById('themeToggle');const printBtn=document.getElementById('printBtn');const backToTop=document.getElementById('backToTop');const copyToast=document.getElementById('copyToast');const lightboxOverlay=document.getElementById('lightboxOverlay');const lightboxImg=document.getElementById('lightboxImg');const lightboxClose=document.getElementById('lightboxClose');const htmlEl=document.documentElement;
function getTheme(){const s=localStorage.getItem('resume-theme');if(s==='light'||s==='dark')return s;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
function applyTheme(t){if(t==='dark'){htmlEl.setAttribute('data-theme','dark')}else{htmlEl.setAttribute('data-theme','light')}localStorage.setItem('resume-theme',t);themeToggle.textContent=t==='dark'?'☀️':'🌓'}
themeToggle.addEventListener('click',()=>{applyTheme(getTheme()==='dark'?'light':'dark')});applyTheme(getTheme());
function showLightbox(src,alt){lightboxImg.src=src;lightboxImg.alt=alt||'图片预览';lightboxOverlay.classList.add('active');lightboxOverlay.setAttribute('aria-hidden','false');lightboxClose.focus()}
function hideLightbox(){lightboxOverlay.classList.remove('active');lightboxOverlay.setAttribute('aria-hidden','true');lightboxImg.src=''}
lightboxClose.addEventListener('click',hideLightbox);lightboxOverlay.addEventListener('click',e=>{if(e.target===lightboxOverlay)hideLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightboxOverlay.classList.contains('active'))hideLightbox()});
function buildHero(){const s=document.createElement('section');s.className='hero-section';s.id='hero';s.innerHTML=`<div class="hero-content"><div class="hero-avatar-row"><div class="hero-avatar"><img src="${resume.avatar}" alt="王德轩头像" loading="lazy" decoding="async" onerror="this.style.display='none';this.parentElement.textContent='王'"></div><div class="hero-name-block"><h1>${resume.name}</h1><p class="hero-subtitle">${resume.title} ｜ ${resume.university}</p></div></div><p class="hero-bio">${resume.bio}</p><div class="hero-badges">${['AI应用','Python','PPT演示','钢琴','吉他','声乐','运营管理','创业经验','5+AI认证'].map(b=>`<span class="badge">${b}</span>`).join('')}<span class="badge accent">省级一等奖</span></div><div class="hero-contact-row"><a href="tel:${resume.phone}" class="btn-contact primary">📞 ${resume.phone}</a><button class="btn-contact" id="heroEmailBtn" data-email-user="${resume.emailUser}" data-email-domain="${resume.emailDomain}">📧 ${resume.emailUser}@${resume.emailDomain}</button><button class="btn-contact" id="douyinBtn" data-img="${resume.douyinImage}">🎵 抖音主页</button></div></div>`;return s}
function buildHighlights(){const s=document.createElement('section');s.className='section-block';s.id='highlights';s.innerHTML=`<div class="section-heading"><span class="section-icon">✨</span>亮点成果</div><div class="highlights-grid">${resume.highlights.map(h=>`<div class="highlight-card"><span class="hl-icon">${h.icon}</span><div class="hl-value">${h.value}</div><div class="hl-label">${h.label.replace(/\n/g,'<br>')}</div></div>`).join('')}</div>`;return s}
function buildExpCard(e){return `<div class="card"><div class="card-header"><div><div class="card-title">${e.role}</div><div class="card-subtitle">${e.company}</div></div><span class="card-meta">${e.period}</span></div><ul class="card-list">${e.highlights.map(h=>`<li>${h}</li>`).join('')}</ul>${e.tags?`<div class="card-tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}${e.link?`<a class="card-link" href="${e.link}" target="_blank" rel="noopener">📎 项目链接</a>`:''}</div>`}
function buildExperience(){const s=document.createElement('section');s.className='section-block';s.id='experience';const gid='exp-tabs';const panels=[{id:'tab-work',label:'💼 工作/实习',content:resume.experience.filter(e=>e.type==='work').map(buildExpCard).join('')||'<p style="color:var(--text-tertiary);padding:16px;">暂无工作经历记录</p>'},{id:'tab-campus',label:'🎓 校园/实践',content:resume.experience.filter(e=>e.type==='campus').map(buildExpCard).join('')||'<p style="color:var(--text-tertiary);padding:16px;">暂无校园经历记录</p>'}];s.innerHTML=`<div class="section-heading"><span class="section-icon">💼</span>经历</div><div class="tab-nav" role="tablist" aria-label="经历分类" id="${gid}-nav">${panels.map((p,i)=>`<button class="tab-btn${i===0?' active':''}" role="tab" aria-selected="${i===0}" aria-controls="${p.id}" id="${p.id}-tab" data-panel="${p.id}" data-tabgroup="${gid}">${p.label}</button>`).join('')}</div>${panels.map((p,i)=>`<div class="tab-panel${i===0?' active':''}" role="tabpanel" id="${p.id}" aria-labelledby="${p.id}-tab" data-tabgroup="${gid}">${p.content}</div>`).join('')}`;return s}
function buildProjects(){const s=document.createElement('section');s.className='section-block';s.id='projects';s.innerHTML=`<div class="section-heading"><span class="section-icon">🚀</span>项目经历</div><div class="projects-grid">${resume.projects.map(p=>`<div class="project-card"><div class="project-card-img" aria-hidden="true">${p.icon||'📁'}</div><div class="project-card-body"><div class="card-title">${p.name}</div><div class="card-subtitle">${p.role} · ${p.period}</div><ul class="card-list" style="margin-bottom:8px;">${p.highlights.map(h=>`<li>${h}</li>`).join('')}</ul>${p.result?`<p style="font-size:.8rem;color:var(--color-accent-dark);font-weight:600;margin:6px 0;">🏆 ${p.result}</p>`:''}<div class="card-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></div>`).join('')}</div>`;return s}
function buildSkills(){const s=document.createElement('section');s.className='section-block';s.id='skills';s.innerHTML=`<div class="section-heading"><span class="section-icon">🛠️</span>技能矩阵</div><div class="skills-grid">${resume.skills.map(sk=>`<div class="skill-category"><div class="skill-cat-title">${sk.category}</div><div class="skill-badges">${sk.items.map(item=>{const isStrong=sk.strong&&sk.strong.includes(item);return `<span class="skill-badge${isStrong?' strong':''}">${item}</span>`}).join('')}</div></div>`).join('')}</div>`;return s}
function buildCertGroupCard(g){const c=document.createElement('div');c.className='cert-group-card';c.innerHTML=`<div class="cert-group-header"><span class="group-icon">${g.icon||'📜'}</span>${g.name}</div><ul class="cert-group-text">${g.textItems.map(t=>`<li>${t} (${g.year})</li>`).join('')}</ul><div class="cert-group-images">${g.images.map(img=>`<div class="cert-img-thumb" data-img="${img}" data-alt="${g.name}" tabindex="0" role="button" aria-label="查看证书图片"><img src="${img}" alt="${g.name}证书" loading="lazy" decoding="async" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;height:100%;font-size:1.2rem;\'>📄</div>'"></div>`).join('')}</div>`;c.querySelectorAll('.cert-img-thumb').forEach(t=>{const src=t.getAttribute('data-img');t.addEventListener('click',()=>showLightbox(src,g.name));t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showLightbox(src,g.name)}})});return c}
function buildEduCert(){const s=document.createElement('section');s.className='section-block';s.id='education-cert';const certTabId='cert-tabs';const eduPanel=`<div class="card"><div class="card-header"><div><div class="card-title">${resume.university}</div><div class="card-subtitle">${resume.college} · ${resume.major} · ${resume.degree}</div></div><span class="card-meta">${resume.period}</span></div><div class="card-tags" style="margin-top:10px;">${resume.courses.map(c=>`<span class="tag">${c}</span>`).join('')}</div></div>`;const certContainer=document.createElement('div');const grid=document.createElement('div');grid.className='cert-group-grid';resume.certGroups.forEach(g=>grid.appendChild(buildCertGroupCard(g)));certContainer.appendChild(grid);const certHTML=certContainer.innerHTML;s.innerHTML=`<div class="section-heading"><span class="section-icon">🎓</span>获奖证书与教育背景</div><div class="tab-nav" role="tablist" aria-label="获奖证书与教育背景" id="${certTabId}-nav"><button class="tab-btn active" role="tab" aria-selected="true" aria-controls="tab-cert" id="tab-cert-tab" data-panel="tab-cert" data-tabgroup="${certTabId}">📜 获奖与证书</button><button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-edu" id="tab-edu-tab" data-panel="tab-edu" data-tabgroup="${certTabId}">🏫 教育背景</button></div><div class="tab-panel active" role="tabpanel" id="tab-cert" aria-labelledby="tab-cert-tab" data-tabgroup="${certTabId}">${certHTML}</div><div class="tab-panel" role="tabpanel" id="tab-edu" aria-labelledby="tab-edu-tab" data-tabgroup="${certTabId}">${eduPanel}</div>`;return s}
function initTabs(){document.querySelectorAll('.tab-nav').forEach(nav=>{const gid=nav.id.replace('-nav','');const btns=nav.querySelectorAll('.tab-btn');const panels=document.querySelectorAll(`.tab-panel[data-tabgroup="${gid}"]`);btns.forEach(btn=>{btn.addEventListener('click',()=>{const pid=btn.getAttribute('data-panel');activateTab(gid,pid,btns,panels)});btn.addEventListener('keydown',e=>{const idx=Array.from(btns).indexOf(btn);let n=idx;if(e.key==='ArrowRight'){n=(idx+1)%btns.length;e.preventDefault()}else if(e.key==='ArrowLeft'){n=(idx-1+btns.length)%btns.length;e.preventDefault()}if(n!==idx){btns[n].focus();btns[n].click()}})})})}
function activateTab(gid,pid,btns,panels){btns.forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false')});panels.forEach(p=>p.classList.remove('active'));const tb=Array.from(btns).find(b=>b.getAttribute('data-panel')===pid);const tp=Array.from(panels).find(p=>p.id===pid);if(tb){tb.classList.add('active');tb.setAttribute('aria-selected','true')}if(tp)tp.classList.add('active')}
function setupEmail(){document.querySelectorAll('[data-email-user]').forEach(b=>b.addEventListener('click',()=>{copyToClipboard(b.getAttribute('data-email-user')+'@'+b.getAttribute('data-email-domain'))}))}
function setupDouyin(){const b=document.getElementById('douyinBtn');if(b)b.addEventListener('click',()=>showLightbox(b.getAttribute('data-img'),'抖音主页截图'))}
function copyToClipboard(text){if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>showToast());else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast()}}
function showToast(){copyToast.classList.add('show');clearTimeout(copyToast._t);copyToast._t=setTimeout(()=>copyToast.classList.remove('show'),1800)}
function updateBackTop(){if(scrollY>500)backToTop.classList.add('visible');else backToTop.classList.remove('visible')}
backToTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',updateBackTop,{passive:true});
printBtn.addEventListener('click',()=>{const ps=document.querySelectorAll('.tab-panel');const hidden=[];ps.forEach(p=>{if(!p.classList.contains('active')){hidden.push(p);p.classList.add('active')}});print();setTimeout(()=>{hidden.forEach(p=>p.classList.remove('active'));initTabs()},300)});
document.querySelectorAll('.nav-links a[href^="#"]').forEach(link=>{link.addEventListener('click',function(e){e.preventDefault();const id=this.getAttribute('href').substring(1);const el=document.getElementById(id);if(el){const navH=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-height'))||60;scrollTo({top:el.getBoundingClientRect().top+pageYOffset-navH-16,behavior:'smooth'})}})});
main.appendChild(buildHero());main.appendChild(buildHighlights());main.appendChild(buildExperience());main.appendChild(buildProjects());main.appendChild(buildSkills());main.appendChild(buildEduCert());initTabs();setupEmail();setupDouyin();updateBackTop();
